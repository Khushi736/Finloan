{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | FinLoan</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            min-height:100vh;
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .auth-card{
            width:100%;
            max-width:460px;
            background:#fff;
            border-radius:24px;
            padding:40px;
            box-shadow:0 20px 50px rgba(0,0,0,.06);
        }

        .icon-box{
            width:90px;
            height:90px;
            margin:0 auto 25px;
            border-radius:24px;
            background:#f1eeff;
            color:#6a4dff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:38px;
        }

        h1{
            text-align:center;
            color:#1a2250;
            margin-bottom:10px;
            font-size:30px;
        }

        .subtitle{
            text-align:center;
            color:#7b819d;
            font-size:15px;
            line-height:1.6;
            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            color:#1a2250;
            font-weight:600;
        }

        .input-box{
            position:relative;
        }

        .input-box i{
            position:absolute;
            left:18px;
            top:50%;
            transform:translateY(-50%);
            color:#7b819d;
        }

        .form-control{
            width:100%;
            height:55px;
            border:1px solid #e5e7eb;
            border-radius:14px;
            padding-left:50px;
            font-size:15px;
            transition:.3s;
        }

        .form-control:focus{
            outline:none;
            border-color:#6a4dff;
            box-shadow:0 0 0 4px #eef2ff;
        }

        .auth-btn{
            width:100%;
            height:55px;
            border:none;
            border-radius:14px;
            background:linear-gradient(
                90deg,
                #7b61ff,
                #5a3dff
            );
            color:#fff;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            transition:.3s;
        }

        .auth-btn:hover{
            transform:translateY(-2px);
        }

        .back-link{
            text-align:center;
            margin-top:20px;
        }

        .back-link a{
            text-decoration:none;
            color:#6a4dff;
            font-weight:600;
        }

    </style>

</head>

<body>

    <div class="auth-card">

        <div class="icon-box">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1>Forgot Password</h1>

        <p class="subtitle">
            Enter your registered email address and we'll send you an OTP to reset your password.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Email Address</label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>

            <button type="submit" class="auth-btn">
                Send OTP
            </button>

        </form>

        <div class="back-link">
            <a href="{% url 'login' %}">
                ← Back to Login
            </a>
        </div>

    </div>

</body>

</html>
