{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Updated | FinLoan</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            min-height:100vh;
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .success-card{
            width:100%;
            max-width:500px;
            background:#fff;
            border-radius:24px;
            padding:50px 40px;
            text-align:center;
            box-shadow:0 20px 50px rgba(0,0,0,.06);
        }

        .success-icon{
            width:110px;
            height:110px;
            margin:0 auto 25px;
            border-radius:50%;
            background:#e8fff5;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#1eb980;
            font-size:48px;
            animation:pop .5s ease;
        }

        @keyframes pop{
            0%{
                transform:scale(0);
            }
            100%{
                transform:scale(1);
            }
        }

        h1{
            color:#1a2250;
            font-size:30px;
            margin-bottom:12px;
        }

        p{
            color:#7b819d;
            font-size:15px;
            line-height:1.7;
            margin-bottom:25px;
        }

        .countdown{
            color:#6a4dff;
            font-weight:600;
            margin-bottom:25px;
        }

        .login-btn{
            width:100%;
            height:55px;
            border:none;
            border-radius:14px;
            background:linear-gradient(
                90deg,
                #7b61ff,
                #5a3dff
            );
            color:#fff;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            text-decoration:none;
            display:flex;
            justify-content:center;
            align-items:center;
            transition:.3s;
        }

        .login-btn:hover{
            transform:translateY(-2px);
        }

    </style>

</head>

<body>

<div class="success-card">

    <div class="success-icon">
        <i class="fa-solid fa-check"></i>
    </div>

    <h1>Password Updated!</h1>

    <p>
        Your password has been changed successfully.
        You can now login using your new password.
    </p>

  

    <a href="{% url 'login' %}" class="login-btn">
        Continue to Login
    </a>

</div>

<script>

setTimeout(function(){

    window.location.href = "{% url 'login' %}";

}, 5000);

</script>

</body>
</html>
