{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | FinLoan</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            min-height:100vh;
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .auth-card{
            width:100%;
            max-width:500px;
            background:#fff;
            border-radius:24px;
            padding:40px;
            box-shadow:0 20px 50px rgba(0,0,0,.06);
        }

        .icon-box{
            width:90px;
            height:90px;
            margin:0 auto 25px;
            border-radius:24px;
            background:#f1eeff;
            color:#6a4dff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:38px;
        }

        h1{
            text-align:center;
            color:#1a2250;
            font-size:30px;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#7b819d;
            font-size:15px;
            line-height:1.6;
            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#1a2250;
        }

        .input-box{
            position:relative;
        }

        .form-control{
            width:100%;
            height:55px;
            border:1px solid #e5e7eb;
            border-radius:14px;
            padding:0 50px 0 18px;
            font-size:15px;
            transition:.3s;
        }

        .form-control:focus{
            outline:none;
            border-color:#6a4dff;
            box-shadow:0 0 0 4px #eef2ff;
        }

        .toggle-password{
            position:absolute;
            right:18px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            color:#7b819d;
        }

        .strength-wrapper{
            margin-top:12px;
        }

        .strength-bar{
            width:100%;
            height:8px;
            background:#e5e7eb;
            border-radius:20px;
            overflow:hidden;
        }

        .strength-fill{
            height:100%;
            width:0%;
            transition:.3s;
        }

        .strength-text{
            margin-top:8px;
            font-size:13px;
            font-weight:600;
        }

        .match-text{
            margin-top:8px;
            font-size:13px;
            font-weight:600;
        }

        .auth-btn{
            width:100%;
            height:55px;
            border:none;
            border-radius:14px;
            background:linear-gradient(
                90deg,
                #7b61ff,
                #5a3dff
            );
            color:#fff;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            transition:.3s;
            margin-top:10px;
        }

        .auth-btn:hover{
            transform:translateY(-2px);
        }

        .back-link{
            text-align:center;
            margin-top:20px;
        }

        .back-link a{
            text-decoration:none;
            color:#6a4dff;
            font-weight:600;
        }

    </style>

</head>

<body>

<div class="auth-card">

    <div class="icon-box">
        <i class="fa-solid fa-key"></i>
    </div>

    <h1>Create New Password</h1>

    <p class="subtitle">
        Your new password must be different from your previous password.
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>New Password</label>

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    required>

                <i class="fa-solid fa-eye toggle-password"
                   onclick="togglePassword('password',this)">
                </i>

            </div>

            <div class="strength-wrapper">

                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>

                <div class="strength-text" id="strengthText">
                    Password Strength
                </div>

            </div>

        </div>

        <div class="form-group">

            <label>Confirm Password</label>

            <div class="input-box">

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    class="form-control"
                    required>

                <i class="fa-solid fa-eye toggle-password"
                   onclick="togglePassword('confirmPassword',this)">
                </i>

            </div>

            <div class="match-text" id="matchText"></div>

        </div>

        <button type="submit" class="auth-btn">
            Update Password
        </button>

    </form>

    <div class="back-link">
        <a href="{% url 'verify_reset_otp' %}">
            ← Back
        </a>
    </div>

</div>

<script>

function togglePassword(id,icon){

    const input=document.getElementById(id);

    if(input.type==="password"){
        input.type="text";
        icon.classList.replace("fa-eye","fa-eye-slash");
    }else{
        input.type="password";
        icon.classList.replace("fa-eye-slash","fa-eye");
    }
}

const password=document.getElementById("password");
const confirmPassword=document.getElementById("confirmPassword");

const strengthFill=document.getElementById("strengthFill");
const strengthText=document.getElementById("strengthText");
const matchText=document.getElementById("matchText");

password.addEventListener("input",()=>{

    const value=password.value;

    let strength=0;

    if(value.length>=8) strength++;
    if(/[A-Z]/.test(value)) strength++;
    if(/[0-9]/.test(value)) strength++;
    if(/[!@#$%^&*]/.test(value)) strength++;

    if(strength===1){
        strengthFill.style.width="25%";
        strengthFill.style.background="#ff6b6b";
        strengthText.innerHTML="Weak Password";
        strengthText.style.color="#ff6b6b";
    }
    else if(strength===2){
        strengthFill.style.width="50%";
        strengthFill.style.background="#ffb347";
        strengthText.innerHTML="Medium Password";
        strengthText.style.color="#ffb347";
    }
    else if(strength===3){
        strengthFill.style.width="75%";
        strengthFill.style.background="#4d6fff";
        strengthText.innerHTML="Good Password";
        strengthText.style.color="#4d6fff";
    }
    else if(strength===4){
        strengthFill.style.width="100%";
        strengthFill.style.background="#1eb980";
        strengthText.innerHTML="Strong Password";
        strengthText.style.color="#1eb980";
    }
});

confirmPassword.addEventListener("input",()=>{

    if(confirmPassword.value===""){
        matchText.innerHTML="";
        return;
    }

    if(password.value===confirmPassword.value){
        matchText.innerHTML="✓ Passwords Match";
        matchText.style.color="#1eb980";
    }else{
        matchText.innerHTML="✗ Passwords Do Not Match";
        matchText.style.color="#ff6b6b";
    }
});

</script>

</body>
</html>
