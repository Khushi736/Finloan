{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | FinLoan</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            min-height:100vh;
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .auth-card{
            width:100%;
            max-width:500px;
            background:#fff;
            border-radius:24px;
            padding:40px;
            box-shadow:0 20px 50px rgba(0,0,0,.06);
        }

        .icon-box{
            width:90px;
            height:90px;
            margin:0 auto 25px;
            border-radius:24px;
            background:#f1eeff;
            color:#6a4dff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:38px;
        }

        h1{
            text-align:center;
            color:#1a2250;
            font-size:30px;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#7b819d;
            font-size:15px;
            line-height:1.6;
            margin-bottom:10px;
        }

        .email{
            text-align:center;
            color:#6a4dff;
            font-size:14px;
            font-weight:600;
            margin-bottom:30px;
        }

        .otp-container{
            display:flex;
            justify-content:center;
            gap:12px;
            margin-bottom:30px;
        }

        .otp-input{
            width:55px;
            height:60px;
            border:2px solid #e5e7eb;
            border-radius:14px;
            text-align:center;
            font-size:22px;
            font-weight:700;
            color:#1a2250;
            transition:.3s;
        }

        .otp-input:focus{
            outline:none;
            border-color:#6a4dff;
            box-shadow:0 0 0 4px #eef2ff;
        }

        .timer{
            text-align:center;
            color:#7b819d;
            font-size:14px;
            margin-bottom:25px;
        }

        .timer a{
            color:#6a4dff;
            font-weight:600;
            text-decoration:none;
            pointer-events:none;
            opacity:.5;
        }

        .timer a.active{
            pointer-events:auto;
            opacity:1;
        }

        .auth-btn{
            width:100%;
            height:55px;
            border:none;
            border-radius:14px;
            background:linear-gradient(
                90deg,
                #7b61ff,
                #5a3dff
            );
            color:#fff;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            transition:.3s;
        }

        .auth-btn:hover{
            transform:translateY(-2px);
        }

        .back-link{
            text-align:center;
            margin-top:20px;
        }

        .back-link a{
            color:#6a4dff;
            text-decoration:none;
            font-weight:600;
        }

        @media(max-width:520px){

            .auth-card{
                padding:30px 20px;
            }

            .otp-container{
                gap:8px;
            }

            .otp-input{
                width:45px;
                height:50px;
                font-size:20px;
            }
        }

    </style>

</head>

<body>

    <div class="auth-card">

        <div class="icon-box">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1>Verify OTP</h1>

        <p class="subtitle">
            We've sent a 6-digit verification code to
        </p>

        <div class="email">
            {{ request.session.reset_email }}
        </div>

        <form method="POST">

            {% csrf_token %}

           <div class="otp-container">

                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>

            </div>

            <input type="hidden" name="otp" id="fullOtp">

            <div class="timer">

                Resend OTP in
                <span id="countdown">30</span>s

                <br><br>

                <a href="{% url 'resend_reset_otp' %}" id="resendLink">
                    Resend OTP
                </a>

            </div>

            <button type="submit" class="auth-btn">
                Verify OTP
            </button>

        </form>

        <div class="back-link">

            <a href="{% url 'forgot_password' %}">
                ← Back
            </a>

        </div>

    </div>

<script>

document.querySelector("form").addEventListener("submit", function(){

    let otp = "";

    document.querySelectorAll(".otp-input").forEach(function(input){
        otp += input.value;
    });

    document.getElementById("fullOtp").value = otp;

    console.log("OTP SUBMITTED:", otp);
});

const inputs = document.querySelectorAll('.otp-input');

inputs.forEach((input,index)=>{

    input.addEventListener('input',()=>{

        if(input.value.length === 1){

            if(index < inputs.length - 1){

                inputs[index+1].focus();
            }
        }
    });

    input.addEventListener('keydown',(e)=>{

        if(
            e.key === 'Backspace' &&
            input.value === '' &&
            index > 0
        ){

            inputs[index-1].focus();
        }
    });
});


let timeLeft = 30;

const countdown =
document.getElementById('countdown');

const resendLink =
document.getElementById('resendLink');

const timer = setInterval(()=>{

    timeLeft--;

    countdown.innerText = timeLeft;

    if(timeLeft <= 0){

        clearInterval(timer);

        countdown.innerText = '0';

        resendLink.classList.add('active');
    }

},1000);

</script>

</body>
</html>
